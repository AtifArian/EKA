<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 2FA Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        button:hover {
            background: #5568d3;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        h3 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Two-Factor Authentication Test</h1>

    <div class="test-section">
        <h3>Test 1: Login with EXISTING user email</h3>
        <p>This should send OTP to email (and show in testing mode)</p>
        <button onclick="testExistingUser()">Test Existing User Login</button>
        <div id="result1" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h3>Test 2: Login with NON-EXISTING user email</h3>
        <p>This should show OTP directly on the website</p>
        <button onclick="testNonExistingUser()">Test Non-Existing User Login</button>
        <div id="result2" class="result" style="display:none;"></div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5050';

        async function testExistingUser() {
            const resultDiv = document.getElementById('result1');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = 'Testing...';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'testlogin@test.com',
                        password: 'Test123!'
                    })
                });

                const data = await response.json();
                resultDiv.className = 'result ' + (response.ok ? 'success' : 'error');
                resultDiv.textContent = 
                    `Status: ${response.status}\n` +
                    `Response:\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function testNonExistingUser() {
            const resultDiv = document.getElementById('result2');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = 'Testing...';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'nonexistent@test.com',
                        password: 'anypassword'
                    })
                });

                const data = await response.json();
                resultDiv.className = 'result ' + (response.ok ? 'success' : 'error');
                resultDiv.textContent = 
                    `Status: ${response.status}\n` +
                    `Response:\n${JSON.stringify(data, null, 2)}\n\n` +
                    (data.otp_code ? `✓ OTP CODE SHOWN: ${data.otp_code}` : '✗ No OTP code in response');
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
